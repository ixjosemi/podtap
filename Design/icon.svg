<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>PodTap</title>
  <!-- The EarPods inline remote, straight on and cropped so it fills the tile at
       its real proportions. Volume up and down sit where Apple prints them; the
       unmarked middle is lit, because that is the one button the app takes over
       and the only thing separating this icon from a picture of a cable.

       Drawn to survive being small. PodTap sets LSUIElement and never appears in
       the Dock, so the icon's real homes are the Finder, Spotlight and the
       System Settings privacy lists — 32px and under. A white bar with a blue
       centre is what is left at 16px, and it is still legible. Earlier attempts
       shot the same object on grey, or laid it on the diagonal; both looked
       better at 512px and dissolved at 16. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3B4046"/>
      <stop offset="100%" stop-color="#1A1D20"/>
    </linearGradient>

    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8C4BB"/>
      <stop offset="12%" stop-color="#F4F2EC"/>
      <stop offset="42%" stop-color="#FFFFFF"/>
      <stop offset="78%" stop-color="#EFECE5"/>
      <stop offset="100%" stop-color="#BAB6AD"/>
    </linearGradient>

    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A9A69F"/>
      <stop offset="30%" stop-color="#F0EEE8"/>
      <stop offset="70%" stop-color="#E6E3DC"/>
      <stop offset="100%" stop-color="#A29F98"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3E8BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3E8BFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="cast" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#05070A" flood-opacity="0.55"/>
    </filter>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <clipPath id="tile">
      <rect x="100" y="84" width="824" height="824" rx="184" ry="184"/>
    </clipPath>
  </defs>

  <rect x="100" y="84" width="824" height="824" rx="184" ry="184"
        fill="#1A1D20" filter="url(#tileShadow)"/>

  <g clip-path="url(#tile)">
    <rect x="100" y="84" width="824" height="824" fill="url(#ground)"/>

    <rect x="492" y="84" width="40" height="824" fill="url(#cord)"/>

    <g filter="url(#cast)">
      <rect x="416" y="168" width="192" height="666" rx="96" ry="96" fill="url(#shell)"/>
    </g>

    <rect x="416" y="168" width="192" height="666" rx="96" ry="96"
          fill="none" stroke="#B4B0A7" stroke-width="3" stroke-opacity="0.7"/>

    <rect x="456" y="204" width="40" height="590" rx="20" fill="url(#sheen)" opacity="0.5"/>

    <g fill="#9B978D">
      <rect x="486" y="278" width="52" height="13" rx="6.5"/>
      <rect x="505.5" y="258.5" width="13" height="52" rx="6.5"/>
      <rect x="486" y="712" width="52" height="13" rx="6.5"/>
    </g>

    <!-- The centre button, held down. -->
    <circle cx="512" cy="500" r="150" fill="url(#glow)"/>
    <circle cx="512" cy="500" r="34" fill="#2F7BF0"/>
  </g>
</svg>
