<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>PodTap — remap the EarPods remote button</title>
  <!-- Same world as the icon: graphite ground, off-white plastic, one blue for
       the button the app takes over. The remote is drawn here at the same
       proportions and with the same shading, so the README and the app icon
       read as one thing. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#3C4147"/>
      <stop offset="55%" stop-color="#24282C"/>
      <stop offset="100%" stop-color="#16181B"/>
    </linearGradient>

    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8C4BB"/>
      <stop offset="14%" stop-color="#F4F2EC"/>
      <stop offset="44%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#EFECE5"/>
      <stop offset="100%" stop-color="#BAB6AD"/>
    </linearGradient>

    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A978F"/>
      <stop offset="35%" stop-color="#E9E6DF"/>
      <stop offset="100%" stop-color="#94918A"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3E8BFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3E8BFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="cast" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#05070A" flood-opacity="0.6"/>
    </filter>

    <clipPath id="frame">
      <rect width="1280" height="540" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="540" fill="url(#ground)"/>

    <!-- Wordmark and tagline. SVG text does not wrap, so every line is an
         explicit tspan. The column stays under ~540px so it never reaches the
         remote at x=706. -->
    <g transform="translate(88 170)">
      <text x="0" y="0" font-size="82" font-weight="700" fill="#FFFFFF"
            letter-spacing="-2">PodTap</text>

      <text x="0" y="56" font-size="26" font-weight="500" fill="#CBD1D7">
        <tspan x="0">Turn the EarPods remote button</tspan>
        <tspan x="0" dy="34">into any macOS key.</tspan>
      </text>

      <text x="0" y="146" font-size="19" fill="#8C949C">
        <tspan x="0">Dictate from your headphone cable</tspan>
        <tspan x="0" dy="27">— one press to start, one to stop.</tspan>
      </text>

      <g transform="translate(0 208)">
        <rect x="0" y="0" width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.07"
              stroke="#FFFFFF" stroke-opacity="0.22"/>
        <text x="98" y="26" font-size="17" font-weight="600" fill="#E4E8EC"
              text-anchor="middle">Native · Swift · MIT</text>
      </g>
    </g>

    <!-- The remote, cable running the full height of the frame. -->
    <g>
      <rect x="754" y="0" width="26" height="540" fill="url(#cord)"/>

      <g filter="url(#cast)">
        <rect x="706" y="86" width="122" height="368" rx="61" ry="61" fill="url(#shell)"/>
      </g>
      <rect x="706" y="86" width="122" height="368" rx="61" ry="61"
            fill="none" stroke="#B4B0A7" stroke-width="2" stroke-opacity="0.7"/>
      <rect x="731" y="108" width="25" height="324" rx="12.5" fill="url(#sheen)" opacity="0.5"/>

      <g fill="#9B978D">
        <rect x="753" y="146" width="33" height="8" rx="4"/>
        <rect x="765" y="134" width="8" height="33" rx="4"/>
        <rect x="753" y="386" width="33" height="8" rx="4"/>
      </g>

      <circle cx="769" cy="270" r="96" fill="url(#glow)"/>
      <circle cx="769" cy="270" r="21" fill="#2F7BF0"/>
    </g>

    <!-- What the two presses do, tied back to the remote with hairlines. -->
    <g transform="translate(884 0)">
      <line x1="-46" y1="196" x2="-14" y2="196" stroke="#FFFFFF" stroke-opacity="0.22"
            stroke-width="2"/>
      <text x="0" y="188" font-size="24" font-weight="650" fill="#FFFFFF">Press once</text>
      <text x="0" y="216" font-size="18" fill="#98A0A8">Holds your key down</text>

      <g transform="translate(266 160)">
        <rect x="0" y="0" width="88" height="46" rx="11" fill="#F4F2EC"/>
        <text x="44" y="31" font-size="21" font-weight="700" fill="#1A1D20"
              text-anchor="middle">F13</text>
      </g>

      <line x1="-46" y1="352" x2="-14" y2="352" stroke="#FFFFFF" stroke-opacity="0.22"
            stroke-width="2"/>
      <text x="0" y="344" font-size="24" font-weight="650" fill="#FFFFFF">Press again</text>
      <text x="0" y="372" font-size="18" fill="#98A0A8">Lets it go, dictation ends</text>
    </g>

    <text x="884" y="470" font-size="16" fill="#7F878F">
      Talk in between — with the button free, so the mic works
    </text>
  </g>
</svg>
