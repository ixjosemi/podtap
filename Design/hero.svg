<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>PodTap — remap the EarPods remote button</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>

    <radialGradient id="haloCool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pane" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="wide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <clipPath id="frame">
      <rect width="1280" height="540" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="540" fill="url(#sky)"/>
    <circle cx="140" cy="90" r="300" fill="url(#haloCool)" filter="url(#wide)"/>
    <circle cx="1180" cy="470" r="320" fill="url(#haloWarm)" filter="url(#wide)"/>

    <!-- Wordmark and tagline.
         SVG text does not wrap, so every line is an explicit tspan. The column
         is kept under ~540px wide so it never reaches the panel at x=690. -->
    <g transform="translate(88 170)">
      <text x="0" y="0" font-size="82" font-weight="700" fill="#FFFFFF"
            letter-spacing="-2">PodTap</text>

      <text x="0" y="56" font-size="26" font-weight="500" fill="#E9D5FF">
        <tspan x="0">Turn the EarPods remote button</tspan>
        <tspan x="0" dy="34">into any macOS key.</tspan>
      </text>

      <text x="0" y="146" font-size="19" fill="#C4B5FD">
        <tspan x="0">Push-to-talk from your headphone</tspan>
        <tspan x="0" dy="27">cable — without losing play/pause.</tspan>
      </text>

      <g transform="translate(0 208)">
        <rect x="0" y="0" width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.14"
              stroke="#FFFFFF" stroke-opacity="0.28"/>
        <text x="98" y="26" font-size="17" font-weight="600" fill="#F5F3FF"
              text-anchor="middle">Native · Swift · MIT</text>
      </g>
    </g>

    <!-- Gesture panel -->
    <g transform="translate(690 78)">
      <rect x="0" y="0" width="500" height="384" rx="34" fill="url(#pane)"
            stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2"/>

      <!-- Short tap -->
      <g transform="translate(40 56)">
        <circle cx="26" cy="26" r="26" fill="#FFFFFF" fill-opacity="0.22"/>
        <circle cx="26" cy="26" r="11" fill="#FFFFFF"/>
        <text x="72" y="20" font-size="24" font-weight="650" fill="#FFFFFF">Short tap</text>
        <text x="72" y="48" font-size="18" fill="#DDD6FE">Play / pause, exactly as before</text>
        <text x="404" y="36" font-size="34" fill="#FFFFFF" text-anchor="middle">⏯</text>
      </g>

      <line x1="40" y1="176" x2="460" y2="176" stroke="#FFFFFF" stroke-opacity="0.18"
            stroke-width="2"/>

      <!-- Press and hold -->
      <g transform="translate(40 216)">
        <circle cx="26" cy="26" r="26" fill="#FFFFFF" fill-opacity="0.22"/>
        <circle cx="26" cy="26" r="11" fill="#FFFFFF"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
          <path d="M 46 12 A 24 24 0 0 1 46 40" stroke-opacity="0.85"/>
          <path d="M 58 2 A 36 36 0 0 1 58 50" stroke-opacity="0.45"/>
        </g>
        <text x="104" y="20" font-size="24" font-weight="650" fill="#FFFFFF">Press and hold</text>
        <text x="104" y="48" font-size="18" fill="#DDD6FE">Holds the key you chose</text>

        <g transform="translate(360 4)">
          <rect x="0" y="0" width="88" height="46" rx="11" fill="#FFFFFF" fill-opacity="0.92"/>
          <rect x="0" y="0" width="88" height="46" rx="11" fill="none" stroke="#FFFFFF"
                stroke-opacity="0.5" stroke-width="2"/>
          <text x="44" y="31" font-size="21" font-weight="700" fill="#4C1D95"
                text-anchor="middle">F13</text>
        </g>
      </g>

      <text x="250" y="352" font-size="16" fill="#C4B5FD" text-anchor="middle">
        Threshold is configurable — measured taps run 79–231 ms
      </text>
    </g>
  </g>
</svg>
